version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kanban_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kanban_api
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/kanban_db?schema=public
      JWT_SECRET: dev-super-secret-jwt-key-change-in-production-min-32-chars
      ENCRYPTION_SECRET_KEY: 32-bytes-secure-random-encryption-key-for-aes256
      DEFAULT_AI_PROVIDER: GEMINI
    ports:
      - '4000:4000'
    depends_on:
      - postgres

volumes:
  postgres_data:
